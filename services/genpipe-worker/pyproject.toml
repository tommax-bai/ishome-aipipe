[project]
name = "genpipe-worker"
version = "0.1.0"
description = "生成/打分/合规检测/母版绘制/场景编译/渲染 activities（弹性伸缩轴独立）"
requires-python = ">=3.12"
dependencies = [
  "temporalio>=1.8",
  "pydantic>=2.9",
  "adapters",
  "scoring",
]

[tool.uv.sources]
adapters = { workspace = true }
scoring = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genpipe_worker"]
