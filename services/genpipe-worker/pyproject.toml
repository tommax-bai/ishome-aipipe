[project]
name = "genpipe-worker"
version = "0.1.0"
description = "非绘图 activities：解析/求解/校验/门禁（V1.4 绘图 activity 已迁出至 render2d/imagegen/render3d 三仓）"
requires-python = ">=3.12"
dependencies = [
  "ishome-contracts",
  "temporalio>=1.8",
  "pydantic>=2.9",
  "httpx>=0.27",
  "pillow>=11.0",  # 分区读的确定性裁剪与放大（剪刀在代码手里，不在模型手里）
  "oss2>=2.18",  # 私有桶：读用户上传的户型图、写解析派生物（2026-09-04 接线，同 render2d）
  "adapters",
  "scoring",
]

# 纵切入口：`uv run genpipe-worker` 启动 activity worker（监听 genpipe-activities）
# 工具入口：`uv run floorplan-parse --image 户型图.png` 户型图解析（首版纯库 + CLI，同渲染层先例；
#           2026-09-04 已接进 Temporal（上传入口就绪）：activity 吃对象键，CLI 吃本地路径，两条路共用纯库）
[project.scripts]
genpipe-worker = "genpipe_worker.worker:main"
floorplan-parse = "genpipe_worker.floorplan_cli:main"
# 工具入口：`uv run floorplan-geometry --image 户型图.png --survey 勘测存档.json` 户型图几何提取
#           （墙线/门窗洞/房间遮罩 → 母版的唯一几何来源）。几何本身零模型调用，
#           给了 --survey 就整轮零调用可复现复跑。
floorplan-geometry = "genpipe_worker.floorplan_geometry_cli:main"

[tool.uv.sources]
ishome-contracts = { git = "ssh://git@github.com/tommax-bai/ishome-contracts.git", tag = "v0.3.0", subdirectory = "gen/python" }
adapters = { workspace = true }
scoring = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genpipe_worker"]
