[project]
name = "design-svc"
version = "0.1.0"
description = "交互设计会话：Design Orchestrator、确认闭环、Patch 引擎、ProjectState 属主、设计项目 Temporal 工作流（namespace: design）"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "temporalio>=1.8",
  "pydantic>=2.9",
  "patch-engine",
]

[tool.uv.sources]
patch-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/design"]
