[project]
name = "design-svc"
version = "0.1.0"
description = "交互设计会话：Design Orchestrator、确认闭环、Patch 引擎、ProjectState 属主、设计项目 Temporal 工作流（namespace: design）"
requires-python = ">=3.12"
dependencies = [
  "ishome-contracts",
  "fastapi>=0.115",
  "temporalio>=1.8",
  "pydantic>=2.9",
  "patch-engine",
  "grpcio>=1.66",
  "python-ulid>=2.7",
]

# 纵切入口：`uv run design-grpc` 启动 DesignService gRPC 服务端（grpc_server.py）
[project.scripts]
design-grpc = "design.grpc_server:main"

[tool.uv.sources]
ishome-contracts = { git = "ssh://git@github.com/tommax-bai/ishome-contracts.git", tag = "v0.2.0", subdirectory = "gen/python" }
patch-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/design"]
