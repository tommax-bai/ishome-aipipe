[project]
name = "ishome-aipipe"
version = "0.0.0"
description = "《是我的家》生成域 monorepo：genpipe-svc / genpipe-worker / chat-svc + packages（uv workspace 虚根）"
requires-python = ">=3.12"
dependencies = [
  "genpipe-svc",
  "genpipe-worker",
  "chat-svc",
  "scoring",
  "adapters",
  "patch-engine",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "packages/*"]

[tool.uv.sources]
genpipe-svc = { workspace = true }
genpipe-worker = { workspace = true }
chat-svc = { workspace = true }
scoring = { workspace = true }
adapters = { workspace = true }
patch-engine = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "copier>=9.4",
]

# ---------------------------------------------------------------------------
# ruff（lint + format）
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# ---------------------------------------------------------------------------
# mypy（strict）
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
# contracts 生成代码（*_pb2_grpc.py 无存根）定向豁免 untyped-call 检查；不许全局放水
untyped_calls_exclude = ["ishome"]
files = [
  "services/genpipe-svc/src",
  "services/genpipe-worker/src",
  "services/chat-svc/src",
  "packages/scoring/src",
  "packages/adapters/src",
  "packages/patch-engine/src",
  "tests",
]

# grpcio 不带 py.typed（grpc.aio 经由 Any）；定向忽略，勿扩大范围
[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# import-linter：模块依赖方向契约（违规挂流水线）。
# 规则来源：《开发规范与代码分层》§1.3；目录白名单（禁 utils/common/helpers）
# 由 tests/test_layout.py 结构测试执行。
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
  "genpipe",
  "genpipe_worker",
  "chat",
  "scoring",
  "adapters",
  "patch_engine",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "workflows 无 IO：只许依赖 models 与 activity 注册名（Temporal 可重放硬约束，非风格偏好）"
type = "forbidden"
source_modules = ["genpipe.workflows"]
forbidden_modules = [
  "genpipe.repo",
  "genpipe.service",
  "genpipe.router",
  "chat.repo",
  "chat.service",
  "chat.router",
  "chat.grpc_server",
  "chat.channel_client",
  "chat.llm_client",
  "chat.intent",
  "chat.orchestrator",
  "chat.migrate",
  "genpipe_worker",
  "fastapi",
  "grpc",
  "httpx",
]

[[tool.importlinter.contracts]]
# chat.repo 为包（__init__ 端口 + memory/pg 双实现），layers 契约含其子模块
name = "领域纵切内 router → service → repo → models 单向"
type = "layers"
layers = ["router", "service", "repo", "models"]
containers = ["genpipe", "chat"]

[[tool.importlinter.contracts]]
name = "worker 内 worker → activities → models 单向"
type = "layers"
layers = ["worker", "activities", "models"]
containers = ["genpipe_worker"]

[[tool.importlinter.contracts]]
name = "跨 domain 数据属主唯一：chat 禁触 genpipe 内部（只许经对方 service）"
type = "forbidden"
source_modules = ["chat"]
forbidden_modules = ["genpipe.repo", "genpipe.router", "genpipe.workflows", "genpipe_worker"]

[[tool.importlinter.contracts]]
name = "跨 domain 数据属主唯一：genpipe 禁触 chat 内部（只许经对方 service）"
type = "forbidden"
source_modules = ["genpipe"]
forbidden_modules = [
  "chat.repo",
  "chat.router",
  "chat.grpc_server",
  "chat.channel_client",
  "chat.llm_client",
  "chat.intent",
  "chat.orchestrator",
  "chat.migrate",
  "genpipe_worker",
]

[[tool.importlinter.contracts]]
name = "跨 domain 数据属主唯一：genpipe_worker 禁触 svc 内部"
type = "forbidden"
source_modules = ["genpipe_worker"]
forbidden_modules = [
  "genpipe.repo",
  "genpipe.router",
  "genpipe.workflows",
  "chat.repo",
  "chat.router",
  "chat.grpc_server",
  "chat.channel_client",
  "chat.llm_client",
  "chat.intent",
  "chat.orchestrator",
  "chat.migrate",
]

[[tool.importlinter.contracts]]
name = "chat 入站边缘 grpc_server → service 单向：禁直接越层触 repo"
type = "forbidden"
source_modules = ["chat.grpc_server"]
forbidden_modules = ["chat.repo", "fastapi"]
# 只禁直接 import（经 service 的传递依赖是分层的正常形态）
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "chat 出站边缘 channel_client 不感知上层：只依赖 contracts 生成代码与运行库"
type = "forbidden"
source_modules = ["chat.channel_client"]
forbidden_modules = [
  "chat.service",
  "chat.router",
  "chat.grpc_server",
  "chat.repo",
  "chat.models",
  "fastapi",
]

[[tool.importlinter.contracts]]
name = "chat 出站边缘 llm_client 不感知上层：只依赖运行库（模型轴 R7 一轴一层）"
type = "forbidden"
source_modules = ["chat.llm_client"]
forbidden_modules = [
  "chat.service",
  "chat.router",
  "chat.grpc_server",
  "chat.repo",
  "chat.models",
  "chat.intent",
  "chat.orchestrator",
  "chat.channel_client",
  "fastapi",
  "grpc",
]

[[tool.importlinter.contracts]]
name = "chat 服务层助手 intent / orchestrator 不越层：只依赖 models 与协议位"
type = "forbidden"
source_modules = ["chat.intent", "chat.orchestrator"]
forbidden_modules = [
  "chat.repo",
  "chat.router",
  "chat.grpc_server",
  "chat.channel_client",
  "chat.llm_client",
  "chat.service",
  "fastapi",
  "grpc",
  "httpx",
]

[[tool.importlinter.contracts]]
name = "chat 迁移边缘 migrate 不感知上层：纯 SQL 执行器只依赖运行库（psycopg + stdlib）"
type = "forbidden"
source_modules = ["chat.migrate"]
forbidden_modules = [
  "chat.service",
  "chat.router",
  "chat.grpc_server",
  "chat.repo",
  "chat.models",
  "chat.intent",
  "chat.orchestrator",
  "chat.channel_client",
  "chat.llm_client",
  "fastapi",
  "grpc",
  "httpx",
]

[[tool.importlinter.contracts]]
name = "chat 存储双实现隔离：memory 不依赖 pg（无 PG 场景零 psycopg）；pg 单向复用会话态缓存"
type = "forbidden"
source_modules = ["chat.repo.memory"]
forbidden_modules = ["chat.repo.pg", "psycopg", "psycopg_pool"]

[[tool.importlinter.contracts]]
name = "packages 不感知使用者：库禁止反向依赖 services"
type = "forbidden"
source_modules = ["scoring", "adapters", "patch_engine"]
forbidden_modules = ["genpipe", "genpipe_worker", "chat"]
