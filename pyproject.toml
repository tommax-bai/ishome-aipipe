[project]
name = "ishome-aipipe"
version = "0.0.0"
description = "《是我的家》生成域 monorepo：genpipe-svc / genpipe-worker / chat-svc + packages（uv workspace 虚根）"
requires-python = ">=3.12"
dependencies = [
  "genpipe-svc",
  "genpipe-worker",
  "chat-svc",
  "scoring",
  "adapters",
  "patch-engine",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "packages/*"]

[tool.uv.sources]
genpipe-svc = { workspace = true }
genpipe-worker = { workspace = true }
chat-svc = { workspace = true }
scoring = { workspace = true }
adapters = { workspace = true }
patch-engine = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",  # fastapi TestClient 的传输层（入站面装配测试）
  "copier>=9.4",
]

# ---------------------------------------------------------------------------
# ruff（lint + format）
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# ---------------------------------------------------------------------------
# mypy（strict）
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
# contracts 生成代码（*_pb2_grpc.py 无存根）定向豁免 untyped-call 检查；不许全局放水
untyped_calls_exclude = ["ishome"]
files = [
  "services/genpipe-svc/src",
  "services/genpipe-worker/src",
  "services/chat-svc/src",
  "packages/scoring/src",
  "packages/adapters/src",
  "packages/patch-engine/src",
  "tests",
]

# grpcio 不带 py.typed（grpc.aio 经由 Any）；定向忽略，勿扩大范围
[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

# oss2 不带 py.typed（阿里云 OSS SDK）；定向忽略，勿扩大范围（同 render2d / imagegen）
[[tool.mypy.overrides]]
module = ["oss2", "oss2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# import-linter：模块依赖方向契约（违规挂流水线）。
# 规则来源：《开发规范与代码分层》§1.3；目录白名单（禁 utils/common/helpers）
# 由 tests/test_layout.py 结构测试执行。
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
  "genpipe",
  "genpipe_worker",
  "chat",
  "scoring",
  "adapters",
  "patch_engine",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "workflows 无 IO：只许依赖 models 与 activity 注册名（Temporal 可重放硬约束，非风格偏好）"
type = "forbidden"
source_modules = ["genpipe.workflows"]
forbidden_modules = [
  "genpipe.repo",
  "genpipe.service",
  "genpipe.router",
  "chat.repo",
  "chat.service",
  "chat.router",
  "chat.grpc_server",
  "chat.channel_client",
  "chat.llm_client",
  "chat.intent",
  "chat.orchestrator",
  "chat.migrate",
  "genpipe_worker",
  "fastapi",
  "grpc",
  "httpx",
]

[[tool.importlinter.contracts]]
# chat.repo 为包（__init__ 端口 + memory/pg 双实现），layers 契约含其子模块
name = "领域纵切内 router → service → repo → models 单向"
type = "layers"
layers = ["router", "service", "repo", "models"]
containers = ["genpipe", "chat"]

[[tool.importlinter.contracts]]
name = "面积推断纯确定性：assumptions 不碰模型调用、不碰网络——数字不由 LLM 决定"
type = "forbidden"
source_modules = ["chat.assumptions"]
forbidden_modules = [
  "chat.llm_client",
  "chat.orchestrator",
  "chat.intent",
  "chat.service",
  "chat.router",
  "chat.repo",
  "chat.grpc_server",
  "chat.channel_client",
  "httpx",
]

[[tool.importlinter.contracts]]
name = "worker 内 三个入口 → activities → floorplan_parse → 三步件 → 确定性件 → models 单向"
type = "layers"
# 两个顶层入口同层且互不可见（"|" = independent siblings）：`worker` 是 Temporal 入口，
# `floorplan_cli` 是工具入口（户型图解析首版纯库 + CLI，接进 Temporal 的时点＝上传入口就绪时）。
# 解析三步（勘测 / 逐块读图例 / 判定）里前两步同层互不可见——它们各自只对整图或一块图负责，
# 谁也不该知道对方的 prompt；判定那一步在上面串起来。
# `floorplan_geometry` 与它们同层，同一条理由的第三次应用：**几何不由 LLM 决定**——
# 墙在哪儿、洞在哪儿、边界在哪儿全部从像素里算，它够不到网关客户端，所以"算得对不对"
# 不是要人相信的话。三个 CLI 入口同层互不可见（各自是一件工具的全部）。
# `floorplan_notes`（拿事实去推理、产批注）与解析前两步同层互不可见：它是**用**事实的一侧，
# 而 `floorplan_facts` 是**产**事实的一侧，两侧分层是"编了引不到"这条机制的结构形态——
# 产事实那一侧够不到网关，用事实那一侧够不到几何，谁也不能顺手把另一边改成自己想要的样子。
# `floorplan_facts`（几何 → 带 id 的结构化户型事实）在几何之上、与网关客户端同层互不可见：
# 同一条理由的第四次应用——**事实不由 LLM 决定**。这批事实的定义就是"读者看图即可自验"的那种，
# 它们够不到网关，所以"这条事实是不是编的"不是要人相信的话；模型该做的是拿它们去推理，不是产它们。
# `orientation` 与 `layout_features` 与 `llm_client` 同层互不可见，是两件事的代码形态：
# **朝向换算与闭集校验都不碰模型调用**——它们若能碰到网关客户端，"没调模型时算得对不对/
# 校验成不成立"就成了要人相信的话，而这两件恰恰是为了不必相信才搬进代码的。
layers = [
  "worker | floorplan_cli | floorplan_geometry_cli",
  "activities",
  "floorplan_parse",
  "floorplan_survey | floorplan_regions | floorplan_notes | floorplan_copy",
  "orientation | llm_client | layout_features | floorplan_facts | object_store",
  "floorplan_geometry",
  "models",
]
containers = ["genpipe_worker"]

[[tool.importlinter.contracts]]
name = "genpipe_worker 出站边缘 object_store 不感知上层：只依赖运行库——拿图的那只手不知道图会被拿去算什么"
type = "forbidden"
source_modules = ["genpipe_worker.object_store"]
forbidden_modules = [
  "genpipe_worker.models",
  "genpipe_worker.layout_features",
  "genpipe_worker.orientation",
  "genpipe_worker.floorplan_geometry",
  "genpipe_worker.floorplan_facts",
  "genpipe_worker.floorplan_parse",
  "genpipe_worker.floorplan_survey",
  "genpipe_worker.floorplan_regions",
  "genpipe_worker.floorplan_notes",
  "genpipe_worker.floorplan_copy",
  "genpipe_worker.llm_client",
  "genpipe_worker.activities",
  "genpipe_worker.worker",
  "genpipe_worker.floorplan_cli",
  "genpipe_worker.floorplan_geometry_cli",
  "httpx",
  "temporalio",
  "PIL",
]

[[tool.importlinter.contracts]]
name = "genpipe_worker 出站边缘 llm_client 不感知上层：只依赖运行库（模型轴 R7 一轴一层）"
type = "forbidden"
source_modules = ["genpipe_worker.llm_client"]
forbidden_modules = [
  "genpipe_worker.models",
  "genpipe_worker.layout_features",
  "genpipe_worker.orientation",
  "genpipe_worker.floorplan_geometry",
  "genpipe_worker.floorplan_parse",
  "genpipe_worker.floorplan_survey",
  "genpipe_worker.floorplan_regions",
  "genpipe_worker.activities",
  "genpipe_worker.worker",
  "genpipe_worker.floorplan_cli",
  "temporalio",
  "fastapi",
]

[[tool.importlinter.contracts]]
name = "闭集校验纯确定性：layout_features 不碰网络、不碰模型调用、不感知上层"
type = "forbidden"
source_modules = ["genpipe_worker.layout_features"]
forbidden_modules = [
  "genpipe_worker.models",
  "genpipe_worker.llm_client",
  "genpipe_worker.floorplan_geometry",
  "genpipe_worker.floorplan_parse",
  "genpipe_worker.floorplan_survey",
  "genpipe_worker.floorplan_regions",
  "genpipe_worker.activities",
  "genpipe_worker.worker",
  "genpipe_worker.floorplan_cli",
  "httpx",
  "temporalio",
]

[[tool.importlinter.contracts]]
name = "朝向换算纯确定性：orientation 只依赖类型层——方位不由 LLM 决定的代码形态"
type = "forbidden"
source_modules = ["genpipe_worker.orientation"]
forbidden_modules = [
  "genpipe_worker.llm_client",
  "genpipe_worker.layout_features",
  "genpipe_worker.floorplan_geometry",
  "genpipe_worker.floorplan_parse",
  "genpipe_worker.floorplan_survey",
  "genpipe_worker.floorplan_regions",
  "genpipe_worker.activities",
  "genpipe_worker.worker",
  "genpipe_worker.floorplan_cli",
  "httpx",
  "PIL",
  "temporalio",
]

[[tool.importlinter.contracts]]
name = "户型事实纯确定性：floorplan_facts 不碰模型调用、不碰网络——事实不由 LLM 决定"
type = "forbidden"
source_modules = ["genpipe_worker.floorplan_facts"]
forbidden_modules = [
  "genpipe_worker.llm_client",
  "genpipe_worker.floorplan_parse",
  "genpipe_worker.floorplan_survey",
  "genpipe_worker.floorplan_regions",
  "genpipe_worker.activities",
  "genpipe_worker.worker",
  "httpx",
  "temporalio",
]

[[tool.importlinter.contracts]]
name = "几何提取纯确定性：floorplan_geometry 不碰模型调用、不碰网络——几何不由 LLM 决定"
type = "forbidden"
source_modules = ["genpipe_worker.floorplan_geometry"]
forbidden_modules = [
  "genpipe_worker.llm_client",
  "genpipe_worker.layout_features",
  "genpipe_worker.orientation",
  "genpipe_worker.floorplan_parse",
  "genpipe_worker.floorplan_survey",
  "genpipe_worker.floorplan_regions",
  "genpipe_worker.activities",
  "genpipe_worker.worker",
  "genpipe_worker.floorplan_cli",
  "genpipe_worker.floorplan_geometry_cli",
  "httpx",
  "temporalio",
]

[[tool.importlinter.contracts]]
name = "跨 domain 数据属主唯一：chat 禁触 genpipe 内部（只许经对方 service）"
type = "forbidden"
source_modules = ["chat"]
forbidden_modules = ["genpipe.repo", "genpipe.router", "genpipe.workflows", "genpipe_worker"]

[[tool.importlinter.contracts]]
name = "跨 domain 数据属主唯一：genpipe 禁触 chat 内部（只许经对方 service）"
type = "forbidden"
source_modules = ["genpipe"]
forbidden_modules = [
  "chat.repo",
  "chat.router",
  "chat.grpc_server",
  "chat.channel_client",
  "chat.llm_client",
  "chat.intent",
  "chat.orchestrator",
  "chat.migrate",
  "genpipe_worker",
]

[[tool.importlinter.contracts]]
name = "跨 domain 数据属主唯一：genpipe_worker 禁触 svc 内部"
type = "forbidden"
source_modules = ["genpipe_worker"]
forbidden_modules = [
  "genpipe.repo",
  "genpipe.router",
  "genpipe.workflows",
  "chat.repo",
  "chat.router",
  "chat.grpc_server",
  "chat.channel_client",
  "chat.llm_client",
  "chat.intent",
  "chat.orchestrator",
  "chat.migrate",
]

[[tool.importlinter.contracts]]
